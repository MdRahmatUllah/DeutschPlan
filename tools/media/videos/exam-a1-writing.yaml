# #1243: format 3, "a mock-exam task in 15 seconds": A1 writing, from A1.1's
# Mock 2, the real paper sat on emulator-5558. The learner (en, A1.1) has
# A1.1, A2.1 and B1.1 introduced, so their mocks are open, and the attempt in
# progress has every other answer given (the device state: the PR). The clip
# ends on the submit, before the result screen: its score would be staged
# (agent-0 on #1411). Captions are facts' tokens where they state a number.
#   python tools/team.py device
#   python tools/media/video.py exam-a1-writing --record
locales: [en, bn, ru]
takes:
  en:
    locales: [en, bn, ru]
    prepare:
      - "shell:am force-stop de.sogda.app"
      - launch
      - sleep5
      - "tap:Learn"
      - sleep2
      - "tap:A1.1"
      - sleep2
      - "tap:Exams"
      - sleep2
      - "at:875,1103"
      - sleep4
      - "tap:Previous"
      - sleep3
      - "at:540,1300"
      - sleep4
      - "shell:input keyevent BACK"
      - sleep2
steps:
  - sleep1
  - "at:540,1300"
  - "shell:input keyevent 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 123"
  - "type: Ich hoffe, du kommst doch. Danke!"
  - sleep2
  - "shell:input keyevent BACK"
  - sleep1
  - "at:1006,216"
  - sleep1
  - "at:540,2224"
  - sleep1
  - "at:754,1367"
  - sleep5
cut: [1.5, 13.7]
captions:
  - from: 0
    to: 5.5
    text:
      en: "A1 writing: a short message with the given words"
      bn: "A1 রাইটিং: দেওয়া শব্দগুলো দিয়ে একটি ছোট বার্তা"
      ru: "A1, письмо: короткое сообщение с заданными словами"
  - from: 5.8
    to: 9.5
    text:
      en: "The given words light up as you use them: at least {mock_exam.writing_min_words.A1} words"
      bn: "দেওয়া শব্দ লিখলেই জ্বলে ওঠে: অন্তত {mock_exam.writing_min_words.A1}টি শব্দ"
      ru: "Заданные слова загораются, когда ты их используешь: минимум {mock_exam.writing_min_words.A1} слов"
  - from: 9.8
    to: 12.2
    text:
      en: "Then the result, section by section"
      bn: "তারপর ফলাফল, প্রতিটি অংশ আলাদা করে"
      ru: "Потом — результат по каждому разделу"
