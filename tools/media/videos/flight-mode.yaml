# #1245: "Flight mode on": the home screen with flight mode on, Sogda
# opened warm (its task brought back, as a learner's tap does: a cold start
# would take the clip's whole length on the emulator), the day's last two
# cards reviewed, and the session's «Gut gemacht!». Prepare the learner first:
# a fresh A1.1 learner at Relaxed · 5, three cards studied, the app on Today
# in the background (Today says «Continue · 3 left»: its practice sentence
# counts, but the card session holds two). Taps by position (at:), as label taps wait for a
# UI dump: Today's primary button, then Show meaning and Good, where the study
# screen draws them on emulator-5558 (1080 x 2424). Captions in the
# listing's own words (de: messaging.md's, a draft).
locales: [en, bn, pl, ru, de]
before:
  - cmd connectivity airplane-mode enable
  - input keyevent KEYCODE_HOME
after:
  - cmd connectivity airplane-mode disable
steps:
  - sleep2
  - "shell:am start -n de.sogda.app/.MainActivity"
  - sleep2
  - "at:540,2035"
  - "at:540,2203"
  - "at:667,2198"
  - "at:540,2203"
  - "at:667,2198"
  # The session's sheet, with the last rating's undo, to the cut's end.
  - sleep9
cut: [1, 13]
captions:
  # Each caption over its screen: the home screen to 2.2 s, then Today and
  # the cards, then «Gut gemacht!».
  - from: 0
    to: 2.2
    text:
      en: Flight mode on
      bn: ফ্লাইট মোড চালু
      pl: Tryb samolotowy włączony
      ru: Режим полёта включён
      de: Flugmodus an
  - from: 2.5
    to: 7.5
    text:
      en: No account and no signal needed
      bn: অ্যাকাউন্ট বা ইন্টারনেট লাগে না
      pl: Bez konta i bez zasięgu
      ru: Без аккаунта и без сети
      de: Ohne Konto, ohne Netz
  - from: 7.8
    to: 12
    text:
      en: Your progress stays on this phone
      bn: আপনার অগ্রগতি এই ফোনেই থাকে
      pl: Twoje postępy zostają na tym telefonie
      ru: Твой прогресс остаётся на этом телефоне
      de: Dein Fortschritt bleibt auf diesem Handy
