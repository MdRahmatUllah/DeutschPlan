# #1245: "Flight mode on": the home screen with flight mode on, Sogda
# opened warm (its task brought back, as a learner's tap does: a cold start
# would take the clip's whole length on the emulator), the day's last two
# cards reviewed, and the session's «Gut gemacht!».
#
# One take per meaning language (#1355, agent-0 on #1348), so each cut's card
# shows its own guide: en and de the English respelling, pl Polish letters, ru
# Cyrillic, bn Bangla letters. Each take's `prepare` makes its learner,
# unrecorded: a fresh A1.1 learner at Relaxed · 5 in that app language, three
# cards studied, the app on Today in the background (Today says «Continue · 3
# left»: its practice sentence counts, but the card session holds two). bn
# keeps setup's default English second (#1156); its take replaced the first
# 5558 recording's English screens and 1.1.0 count (agent-5, launch week).
#
# Recorded on emulator-5556 (1080 x 1920, the media lane's:
# `video.py flight-mode --serial emulator-5556` under `team.py lock
# emulator-5556`). Taps by position (at:), as label taps wait for a UI dump:
# Today's primary button, then Show meaning and Good, where the screens draw
# them there; each setup leaves its session by its close button (at 77,120),
# as a back key there lost Today's next tap on v1.2.1's build (bn's takes).
# Captions in the listing's own words (de: messaging.md's, a draft).
