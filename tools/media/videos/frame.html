<!doctype html>
<html lang="$lang"><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(data:font/ttf;base64,$inter);font-weight:100 900}
@font-face{font-family:Bengali;src:url(data:font/ttf;base64,$bengali);font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:${width}px;height:${height}px;background:$ground;color:$ink;font-family:Inter,Bengali,sans-serif;position:relative;overflow:hidden}
.frame{position:absolute;left:${left}px;top:${top}px;width:${frame_width}px;height:${frame_height}px;display:flex;flex-direction:$direction;gap:${gap}px}
.caption{flex:0 0 ${caption_extent}px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.caption p{font-size:${caption}px;font-weight:$caption_weight;line-height:$line_height;letter-spacing:${tracking}em}
.hole{flex:1 1 0;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.screen{border:${border}px solid $ink;border-radius:${radius}px;box-shadow:${shadow}px ${shadow}px 0 $ink;background:$ink}
</style></head>
<body><div class="frame">
<div class="caption"><p>$caption_text</p></div>
<div class="hole"><div class="screen"></div></div>
</div></body></html>
