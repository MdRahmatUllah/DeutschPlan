<!doctype html>
<html lang="$lang"><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;src:url(data:font/ttf;base64,$inter);font-weight:100 900}
@font-face{font-family:Bengali;src:url(data:font/ttf;base64,$bengali);font-weight:100 900}
:root{--lagoon:$lagoon;--sun:$sun;--ink:$ink;--paper:$paper;--night:$night;--cobalt:$cobalt;--rasp:$raspberry;--emerald:$emerald;--k:$k;--lh:$lh}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden}
body{font-family:Inter,Bengali,sans-serif;color:var(--ink);position:relative}
.scene{position:absolute;inset:0;display:none}
.stack{position:absolute;display:flex;flex-direction:column;gap:30px}
.stack.left{left:110px;align-items:flex-start}
.stack.right{right:110px;align-items:flex-end}
.st{position:relative;display:inline-block;border:5px solid var(--ink);border-radius:22px;box-shadow:10px 10px 0 var(--ink);padding:.16em .48em .2em;font-weight:800;letter-spacing:-.02em;line-height:var(--lh);font-size:calc(80px*var(--k));max-width:1120px;text-wrap:balance}
.st.small{font-size:calc(54px*var(--k));font-weight:700;border-width:4px;box-shadow:8px 8px 0 var(--ink)}
.st:empty{display:none}
#cg,#cm{font-size:calc(46px*var(--k))}
.sun{background:var(--sun)}.paper{background:var(--paper)}.lagoon{background:var(--lagoon)}.rasp{background:var(--rasp)}.emerald{background:var(--emerald)}.cobalt{background:var(--cobalt);color:var(--paper)}
.wipe{position:absolute;top:-10%;left:-15%;width:130%;height:120%;transform:translateX(-130%) skewX(-14deg)}
.phone{position:absolute;width:420px;height:840px;border:12px solid var(--ink);border-radius:58px;overflow:hidden;background:var(--paper);box-shadow:16px 16px 0 var(--ink)}
.phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#corner{position:absolute;right:56px;top:46px;background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:10px 18px}
#corner svg{display:block;width:230px;height:auto}
#card{background:var(--paper) radial-gradient(rgba(0,194,178,.35) 3px,transparent 3.6px) 0 0/46px 46px}
.line{position:absolute;height:6px;background:var(--ink);transform-origin:left center}
.dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--sun);border:5px solid var(--ink)}
#lcard{position:absolute;left:80px;top:120px;width:620px;background:var(--paper);border:5px solid var(--ink);border-radius:22px;box-shadow:12px 12px 0 var(--ink);padding:34px 40px;font-size:30px;font-weight:500;line-height:1.55;letter-spacing:-.005em}
#lcard .w{border-radius:6px;padding:0 3px;margin:0 -3px}
#ladder{background:var(--night)}
#atoc{position:absolute;left:110px;top:120px;font-size:170px;font-weight:800;letter-spacing:-.04em;color:var(--sun);line-height:1}
.lv{position:absolute;font-size:46px;font-weight:800;padding:.14em .44em;border:4px solid var(--ink);border-radius:16px;box-shadow:7px 7px 0 var(--ink)}
#stats{position:absolute;left:110px;top:690px;width:980px;display:flex;flex-wrap:wrap;gap:24px 26px}
#stats .st{font-size:calc(50px*var(--k))}
#ap{position:absolute;left:110px;top:150px;display:flex;align-items:center;gap:30px;background:var(--paper);border:5px solid var(--ink);border-radius:26px;box-shadow:10px 10px 0 var(--ink);padding:22px 30px}
#ap svg{width:84px;height:84px;display:block}
#track{position:relative;width:150px;height:80px;border:5px solid var(--ink);border-radius:40px;background:var(--paper)}
#thumb{position:absolute;top:6px;left:6px;width:58px;height:58px;border-radius:50%;background:var(--ink)}
#end{background:var(--lagoon)}
#lockup{position:absolute;left:50%;top:330px;width:980px;margin-left:-490px}
#lockup svg{display:block;width:100%;height:auto}
#end .stack{left:0;right:0;top:720px;align-items:center}
#e2{font-size:46px;font-weight:700;letter-spacing:-.01em}
</style></head><body>

<div id="hook" class="scene"><div class="stack left" style="top:330px">
  <div id="h1" class="st sun">$hook_1</div>
  <div id="h2" class="st paper">$hook_2</div>
</div></div>

<div id="today" class="scene"><div class="stack right" style="top:190px">
  <div id="t1" class="st sun">$today_1</div>
  <div id="t2" class="st small paper">$today_2</div>
</div></div>

<div id="card" class="scene">
  <div class="stack left" style="top:300px"><div id="c1" class="st lagoon" style="max-width:860px">$card</div></div>
  <div id="cphone" class="phone" style="left:1000px;top:110px"><img id="cfront" src="$shot_front"><img id="cback" src="$shot_back" style="display:none"></div>
  <div id="lg" class="line" style="left:1190px;top:380px;width:290px"></div><div id="dg" class="dot" style="left:1190px;top:383px"></div>
  <div id="lm" class="line" style="left:1285px;top:491px;width:195px"></div><div id="dm" class="dot" style="left:1285px;top:494px"></div>
  <div id="cg" class="st small emerald" style="position:absolute;left:1480px;top:340px">$guide</div>
  <div id="cm" class="st small sun" style="position:absolute;left:1480px;top:452px">$meaning</div>
</div>

<div id="letter" class="scene">
  <div id="lcard">$letter_html</div>
  <div class="stack left" style="top:590px">
    <div id="l1" class="st sun" style="max-width:880px">$letter_1</div>
    <div id="l2" class="st small paper" style="max-width:880px">$letter_2</div>
  </div>
</div>

<div id="ladder" class="scene">
  <div id="atoc">A1 → C2</div>
  <div id="lvA1" class="lv lagoon" style="left:110px;top:520px">A1</div>
  <div id="lvA2" class="lv emerald" style="left:250px;top:485px">A2</div>
  <div id="lvB1" class="lv sun" style="left:390px;top:450px">B1</div>
  <div id="lvB2" class="lv rasp" style="left:530px;top:415px">B2</div>
  <div id="lvC1" class="lv cobalt" style="left:670px;top:380px">C1</div>
  <div id="lvC2" class="lv paper" style="left:810px;top:345px">C2</div>
  <div id="stats">
    <div id="s1" class="st small sun">$steps</div><div id="s2" class="st small lagoon">$words</div>
    <div id="s3" class="st small emerald">$grammar</div><div id="s4" class="st small rasp">$exams</div>
  </div>
  <div id="p1" class="phone" style="left:1080px;top:150px"><img src="$shot_course"></div>
  <div id="p3" class="phone" style="left:1440px;top:150px"><img src="$shot_word"></div>
  <div id="p2" class="phone" style="left:1260px;top:110px"><img src="$shot_step"></div>
</div>

<div id="sky" class="scene">
  <div id="ap"><svg viewBox="0 0 24 24"><path fill="$ink" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg><div id="track"><div id="thumb"></div></div></div>
  <div class="stack left" style="top:560px">
    <div id="o1" class="st sun">$offline_1</div>
    <div id="o2" class="st small paper">$offline_2</div>
  </div>
</div>

<div id="end" class="scene">
  <div id="lockup">$logo</div>
  <div class="stack"><div id="e1" class="st paper">$end</div><div id="e2">Google Play · sogda.de</div></div>
</div>

<div id="corner">$logo</div>
<div id="w1" class="wipe lagoon"></div><div id="w2" class="wipe sun"></div><div id="w3" class="wipe rasp"></div>
<div id="w4" class="wipe cobalt"></div><div id="w5" class="wipe emerald"></div><div id="w6" class="wipe lagoon"></div>

<script>
var E={lin:function(x){return x},out:function(x){return 1-Math.pow(1-x,3)},io:function(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},back:function(x){var c=1.6,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)}};
function k(t,keys){if(t<=keys[0][0])return keys[0][1];for(var i=1;i<keys.length;i++){var a=keys[i-1],b=keys[i];if(t<=b[0]){return a[1]+(b[1]-a[1])*E[b[2]||'out']((t-a[0])/(b[0]-a[0]))}}return keys[keys.length-1][1]}
function q(id){return document.getElementById(id)}
function show(id,t,a,b){q(id).style.display=(t>=a&&t<b)?'block':'none'}
// a sticker slides in from its side (dir -1: from the left, 1: from the right) and out again
function slide(id,t,t0,t1,dir){var x=k(t,[[t0,dir*1700],[t0+.5,0,'back'],[t1,0],[t1+.35,dir*1700,'io']]);q(id).style.transform='translateX('+x+'px)'}
function pop(id,t,t0,t1){var s=k(t,[[t0,0],[t0+.38,1,'back'],[t1,1],[t1+.25,0,'io']]);q(id).style.transform='scale('+s+')';q(id).style.opacity=t<t0?0:1}
function wipe(id,t,at){var x=k(t,[[at-.3,-130],[at,0,'io'],[at+.3,130,'io']]);q(id).style.transform='translateX('+x+'%) skewX(-14deg)'}
function hl(el,t,t0,rgb){var a=k(t,[[t0,0],[t0+.25,1]]);el.style.background='rgba('+rgb+','+(.55*a)+')';el.style.boxShadow='inset 0 -5px 0 rgba('+rgb+','+a+')'}
var LV={'A1':'0,194,178','A2':'255,198,26','B1':'255,61,127','B2':'61,90,254'};
function render(t){
  show('hook',t,0,3.4);slide('h1',t,.15,3.0,-1);slide('h2',t,.55,3.05,-1);
  show('today',t,3.4,8.2);slide('t1',t,3.7,7.8,1);slide('t2',t,4.0,7.85,1);
  show('card',t,8.2,13.0);
  var cy=k(t,[[8.2,900],[8.75,0,'back']]),rx=k(t,[[8.2,28],[8.75,0]]);
  var ry=t<10.12?k(t,[[9.85,0],[10.12,90,'io']]):k(t,[[10.12,-90],[10.4,0,'out']]);
  q('cphone').style.transform='perspective(1800px) translateY('+cy+'px) rotateX('+rx+'deg) rotateY('+ry+'deg)';
  q('cfront').style.display=t<10.12?'block':'none';q('cback').style.display=t<10.12?'none':'block';
  slide('c1',t,8.45,12.6,-1);
  var g=k(t,[[10.55,0],[10.9,1]]),m=k(t,[[10.85,0],[11.2,1]]);
  q('lg').style.transform='scaleX('+g+')';q('lm').style.transform='scaleX('+m+')';
  q('dg').style.opacity=t>=10.55?1:0;q('dm').style.opacity=t>=10.85?1:0;
  pop('cg',t,10.85,12.65);pop('cm',t,11.15,12.65);
  show('letter',t,13.0,17.0);
  var lc=k(t,[[13.15,-900],[13.65,0,'back'],[16.6,0],[16.95,-900,'io']]);q('lcard').style.transform='translateX('+lc+'px) rotate(-3.5deg)';
  var ws=document.querySelectorAll('#lcard .w');for(var i=0;i<ws.length;i++){hl(ws[i],t,13.9+i*.16,LV[ws[i].getAttribute('data-l')])}
  slide('l1',t,13.35,16.6,-1);slide('l2',t,13.75,16.65,-1);
  show('ladder',t,17.0,21.6);
  q('atoc').style.transform='translateY('+k(t,[[17.1,-400],[17.55,0,'back']])+'px)';
  ['A1','A2','B1','B2','C1','C2'].forEach(function(l,i){pop('lv'+l,t,17.5+i*.12,21.25)});
  ['s1','s2','s3','s4'].forEach(function(s,i){pop(s,t,18.4+i*.28,21.25)});
  [['p1',-11,17.7],['p2',0,17.9],['p3',11,18.1]].forEach(function(p){var y=k(t,[[p[2],1000],[p[2]+.55,0,'back']]);q(p[0]).style.transform='translateY('+y+'px) rotate('+p[1]+'deg) scale(.86)'});
  show('sky',t,21.6,25.4);
  slide('ap',t,21.8,25.05,-1);
  var on=k(t,[[22.35,0],[22.6,1,'io']]);q('thumb').style.left=(6+on*60)+'px';q('track').style.background=on>.5?'var(--lagoon)':'var(--paper)';
  slide('o1',t,22.65,25.05,-1);slide('o2',t,23.0,25.1,-1);
  show('end',t,25.4,99);
  q('lockup').style.transform='scale('+k(t,[[25.5,.55],[26.0,1,'back']])+')';q('lockup').style.opacity=t<25.5?0:1;
  pop('e1',t,26.1,99);pop('e2',t,26.45,99);
  q('corner').style.display=(t>=.35&&t<25.4)?'block':'none';
  wipe('w1',t,3.4);wipe('w2',t,8.2);wipe('w3',t,13.0);wipe('w4',t,17.0);wipe('w5',t,21.6);
  q('w6').style.transform='translateX('+k(t,[[25.1,-130],[25.4,0,'io']])+'%) skewX(-14deg)';q('w6').style.display=t<25.4?'block':'none';
}
render(0);
</script>
</body></html>
