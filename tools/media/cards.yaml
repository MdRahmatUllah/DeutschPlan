    ru:
      headline: "{noun:8625e5e3d3dd76d1} · {noun:655d20a7193aa75f} · {noun:abbedc26a645c26e}"
      line: "der, die или das? Ответь целым предложением."
    de:
      headline: "{noun:8625e5e3d3dd76d1} · {noun:655d20a7193aa75f} · {noun:abbedc26a645c26e}"
      line: "der, die oder das? Antworten Sie mit einem ganzen Satz."
