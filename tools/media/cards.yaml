      line: "In Sogda: {meaning:78c7379f726ce97f}"

# --- #1242, "der, die or das? Answer in a full sentence": three nouns, one
# of each article, then the answer card the next day.
besteck-question:
  text:
    en:
      headline: "{noun:8625e5e3d3dd76d1} · {noun:655d20a7193aa75f} · {noun:abbedc26a645c26e}"
      line: "der, die or das? Answer with a whole sentence."
    bn:
      headline: "{noun:8625e5e3d3dd76d1} · {noun:655d20a7193aa75f} · {noun:abbedc26a645c26e}"
      line: "der, die না das? পুরো একটি বাক্যে উত্তর দিন।"
    pl:
      headline: "{noun:8625e5e3d3dd76d1} · {noun:655d20a7193aa75f} · {noun:abbedc26a645c26e}"
