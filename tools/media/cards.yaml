# Cards for `python tools/media/stills.py card --card <id>` (#1242, #1244).
# Each card has a headline and a line per language. Course words are never
# typed: `{word:<uid>}` is the word with its article, `{noun:<uid>}` the word
# alone, `{meaning:<uid>}` its meaning in the card's language, all from
# content.db. Every line is a draft until its native review (bn and pl
# agent-1, ru agent-2, en and de agent-0).

# --- #1244, "The word that fools you": a German word beside its look-alike,
# then the app's own meaning in the viewer's language.
termin-ru:
  text:
    ru:
      headline: "{word:4a51e6804d593c0b} ≠ «термин»"
      line: "В Sogda: {meaning:4a51e6804d593c0b}"
familie-ru:
  text:
    ru:
      headline: "{word:9901d257c37d28d4} ≠ «фамилия»"
      line: "В Sogda: {meaning:9901d257c37d28d4}"
gymnasium-pl:
  text:
    pl:
      headline: "{word:861b6760b7ab15c2} ≠ «gimnazjum»"
      line: "W aplikacji Sogda: {meaning:861b6760b7ab15c2}"
gift-en:
  text:
    en:
      headline: "{word:817b658f7dd0fb1f} ≠ gift"
      line: "In Sogda: {meaning:817b658f7dd0fb1f}"
gift-bn:
