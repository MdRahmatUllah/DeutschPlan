# Static analysis for Sogda.
# Rules here are the ones docs/05-dev-guide/coding-standards.md requires.
# The basic check runs `dart analyze --fatal-infos` (no path args, ADR 18),
# which fails on any issue below; CI is off (#302).

include: package:flutter_lints/flutter.yaml

# riverpod_lint 3.1.4+ is a native analysis_server plugin — it is installed here,
# not through custom_lint (see ADR 15 in docs/05-dev-guide/decisions.md).
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  # #697 TL-11: no implicit dynamic casts, no inferred dynamic, no raw
  # generics.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated code is rebuilt by `make gen`; linting it is not actionable.
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - "lib/l10n/generated/**"
    # drift_dev's schema snapshots for the migration tests.
    - "test/db/generated/**"

linter:
  rules:
    # docs/05-dev-guide/coding-standards.md
    - prefer_final_locals
    - avoid_dynamic_calls
    - require_trailing_commas
    - always_declare_return_types
    # #697 TL-11: a dropped future (a DB write, CC-3) is a decision, spelled
    # `unawaited(...)`, never an accident.
    - discarded_futures
    - unawaited_futures
