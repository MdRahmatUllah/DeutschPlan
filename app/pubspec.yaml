name: deutschplan
description: "An exam-structured, fully offline German study plan from A1.1 to C2.2."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Versions are the ones verified against pub.dev for this repository; see
# docs/01-architecture/tech-stack.md and the ADRs in docs/05-dev-guide/decisions.md.
# Upgrade deliberately, one package at a time, with a note in decisions.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Design system (standalone since Flutter 3.47 — never package:flutter/material.dart)
  material_ui: ^1.2.0
  cupertino_ui: ^1.0.2
  cupertino_icons: ^1.0.8

  # State and DI
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Routing
  go_router: ^18.0.1

  # Database
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.6.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Localisation
  intl: ^0.20.3

  # Speech and audio
  flutter_tts: ^4.2.5
  flutter_onnxruntime: ^1.8.5
  just_audio: ^0.10.6
  record: ^7.1.1

  # On-device translation
  llamadart: ^0.8.24

  # Downloads, notifications, widget, background work
  background_downloader: ^9.6.2
  flutter_local_notifications: ^22.3.1
  home_widget: ^0.10.0
  workmanager: ^0.10.10

  # Files and sharing
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  share_plus: ^13.3.0

  # Web links
  flutter_custom_tabs: ^2.6.0

  # Presentation
  flutter_animate: ^4.5.2
  fl_chart: ^1.2.0

  # Platform
  permission_handler: ^13.0.2
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

  # Checksums for the model manifest (FR-M4-01). `convert` is crypto's
  # chunked-hashing sink: a 575 MB model is not read into memory to hash it.
  crypto: ^3.0.6
  convert: ^3.1.2

  # Logging (no analytics, ever — BR-PRIV-01)
  logging: ^1.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  go_router_builder: ^4.5.0
  drift_dev: ^2.35.0

  # Only so test/db/ can point AppDatabase.open() at a temp directory. Already
  # in the tree as a transitive dependency of path_provider.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  freezed: ^4.0.2
  json_serializable: ^6.14.1

  flutter_lints: ^6.0.0
  # riverpod_lint 3.1.4+ is a native analyzer plugin; it no longer needs custom_lint
  riverpod_lint: ^3.1.9

  mocktail: ^1.0.5
  alchemist: ^0.14.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/licences/
    # The compiled course, and the manifest the app stores as its new baseline
    # after an update so the next one can say what changed
    # (content-database.md, step 2). Written by `make content`.
    - assets/db/
    # The model manifest: URL, size, SHA-256 and licence per variant
    # (FR-M4-02). The models themselves are downloaded, never bundled.
    - assets/models/

  # Variable fonts: one file covers wght 100-900, so the whole type scale in
  # docs/01-architecture/theming.md ships in three files instead of ten.
  # Inter carries no Bangla glyphs - mixed strings resolve Bangla through the
  # fontFamilyFallback in lib/core/typography/app_fonts.dart.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Italic-Variable.ttf
          style: italic
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
