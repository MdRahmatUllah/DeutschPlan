name: sogda
description: "An exam-structured, fully offline German study plan from A1.1 to C2.2."
publish_to: 'none'

version: 1.1.0+4

environment:
  sdk: ^3.13.0

# Versions are the ones verified against pub.dev for this repository; see
# docs/01-architecture/tech-stack.md and the ADRs in docs/05-dev-guide/decisions.md.
# Upgrade deliberately, one package at a time, with a note in decisions.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Design system (standalone since Flutter 3.47 — never package:flutter/material.dart)
  material_ui: ^1.2.0
  cupertino_ui: ^1.0.2
  cupertino_icons: ^1.0.8

  # State and DI
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Routing
  go_router: ^18.0.1

  # Database
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.6.0

  # Localisation
  intl: ^0.20.3

  # Speech and audio
  # #623: the session just_audio plays in, configured as speech that ducks.
  audio_session: ^0.2.4
  flutter_tts: ^4.2.5
  flutter_onnxruntime: ^1.8.5
  just_audio: ^0.10.6
  record: ^7.1.1

  # Downloads, notifications, widget, background work
  background_downloader: ^9.6.2
  flutter_local_notifications: ^22.3.1
  # TZDateTime for flutter_local_notifications' zonedSchedule (#157); it was
  # already in the tree as that plugin's dependency.
  timezone: ^0.11.1
  home_widget: ^0.10.0
  workmanager: ^0.10.10

  # Files and sharing
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  share_plus: ^13.3.0

  # Presentation
  fl_chart: ^1.2.0

  # Platform
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.1

  # Checksums for the model manifest (FR-M4-01). `convert` is crypto's
  # chunked-hashing sink: a 575 MB model is not read into memory to hash it.
  crypto: ^3.0.6
  convert: ^3.1.2

  # Web links (FR-R1-06): url_launcher's in-app browser view, a Custom Tab on
  # Android.
  url_launcher: ^6.3.2
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3

  # On-device translation (ADR 30, #154): Hy-MT2 through llama.cpp.
  llamadart: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  go_router_builder: ^4.5.0
  drift_dev: ^2.35.0

  # Only so test/db/ can point AppDatabase.open() at a temp directory. Already
  # in the tree as a transitive dependency of path_provider.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

  flutter_lints: ^6.0.0
  # riverpod_lint 3.1.4+ is a native analyzer plugin; it no longer needs custom_lint
  riverpod_lint: ^3.1.9

# llamadart's native-assets hook bundles only llama.cpp's CPU backend (ADR 27,
# back with ADR 30). Hy-MT2 runs on the CPU; by default the hook also ships the
# Vulkan backend and the whole LiteRT-LM runtime (LiteRT, WebGPU, the Gemma
# constraint libraries), about 77 MB of the arm64 APK that nothing loads.
# `runtimes` drops LiteRT-LM on every platform, iOS included (no Apple
# companion package here); `backends` is Android's (Apple's are fixed). The
# keys are read by llamadart's hook/build.dart and
# lib/src/hook/native_bundle_config.dart (the same names in 0.9.0).
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: llama_cpp
      llamadart_native_backends:
        platforms:
          android: [cpu]

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/licences/
    # The compiled course, and the manifest the app stores as its new baseline
    # after an update so the next one can say what changed
    # (content-database.md, step 2). Written by `make content`. Named, not
    # the folder, so assets/db/README.md stays out of the APK (#707).
    - assets/db/content.db
    - assets/db/content_manifest.json
    # The model manifest: URL, size, SHA-256 and licence per variant
    # (FR-M4-02). The models themselves are downloaded, never bundled.
    - assets/models/

  # Variable fonts: one file covers wght 100-900, so the whole type scale in
  # docs/01-architecture/theming.md ships in three files instead of ten.
  # Inter carries no Bangla glyphs - mixed strings resolve Bangla through the
  # fontFamilyFallback in lib/core/typography/app_fonts.dart.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Italic-Variable.ttf
          style: italic
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Variable.ttf
