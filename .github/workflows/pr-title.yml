# docs/05-dev-guide/coding-standards.md: "Commits: Conventional Commits. PR titles
# reference the screen or engine (`feat(study): FR-T2-08 swipe to rate`)."
#
# The check is inline on purpose: a marketplace action would be a third-party
# dependency with write access to a repository whose whole premise is that
# nothing leaves the device.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: none

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -u
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'

          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            echo ""
            echo "Expected:  <type>(<scope>): <description>"
            echo "Types:     feat fix docs style refactor perf test build ci chore revert"
            echo "Scope:     the screen or engine, e.g. feat(study): FR-T2-08 swipe to rate"
            exit 1
          fi

          subject=${TITLE#*: }
          if [ ${#subject} -lt 10 ]; then
            echo "::error::Describe the change in the title; '$subject' is too short."
            exit 1
          fi
          if printf '%s' "$subject" | grep -Eq '\.$'; then
            echo "::error::Drop the trailing full stop from the PR title."
            exit 1
          fi

          echo "OK: $TITLE"
