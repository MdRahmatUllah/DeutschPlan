#  The gate on every pull request.
#
#  docs/05-dev-guide/testing.md sets the bar; this is what makes it real. Two
#  jobs rather than one, because a Python failure behind a ten-minute Flutter
#  build is a failure nobody reads — and because they have no reason to wait
#  for each other.
#
#  The SDK is read from .fvmrc, which getting-started.md calls the single
#  source of truth. A version written here as well would be a second copy to
#  keep in step by hand, and the one that goes stale is always the one CI uses.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first: the older run is
# answering a question nobody is asking any more.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: analyze, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned SDK
        id: sdk
        run: |
          version="$(jq -er '.flutter' .fvmrc)"
          echo "Pinned Flutter: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true

      # Two caches, not one. `~/.pub-cache` is hundreds of megabytes that only
      # changes when the lock file does; keying it on the sources as well
      # would save a fresh copy on every PR that touched a single Dart file,
      # and evict the entries that would have been hits.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ steps.sdk.outputs.version }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ steps.sdk.outputs.version }}-

      # Generated code is git-ignored (ADR 17), so every run regenerates it —
      # which also means a generator that has started producing different
      # output fails here rather than on someone's machine. The cache only
      # saves build_runner the work it can reuse.
      - name: Cache build_runner output
        uses: actions/cache@v4
        with:
          path: app/.dart_tool/build
          key: >-
            build-${{ runner.os }}-${{ steps.sdk.outputs.version }}-${{
            hashFiles('app/pubspec.lock', 'app/lib/**/*.drift',
            'app/lib/**/*.dart') }}
          restore-keys: build-${{ runner.os }}-${{ steps.sdk.outputs.version }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      # `make gen` and not `build_runner build` alone: the mirror and the
      # migration helpers are inputs to it, and a mirror that no longer
      # matches the pipeline's DDL is exactly the kind of drift CI is for.
      - name: make gen
        run: make gen

      - name: make lint
        run: make lint

      - name: make test
        run: make test

  content:
    name: content pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      - name: pytest
        run: python -m pytest tools/tests -q

      # The committed asset, when there is one. The four workbooks are not in
      # this repository, so `app/assets/db/content.db` only exists once someone
      # has run `make content` and committed it — and from that moment on, the
      # thing that actually ships has to pass every gate on every PR.
      #
      # `tools/tests/test_make_content.py` already verifies a database built
      # from the fixtures; this verifies the real one.
      - name: verify the shipped content.db
        run: |
          db=app/assets/db/content.db
          if [ -f "$db" ]; then
            python tools/verify_content.py --db "$db"

            # The app reads `content_version` from the manifest rather than
            # opening the 8 MB database on every launch, so the two shipped
            # files have to agree. `make content` writes them from one value
            # and cannot disagree; two `cp` lines and a hand-copied file can.
            # A stale manifest parses fine, so nothing at runtime notices —
            # the app just skips an update, or reinstalls for nothing.
            python - <<'PY'
          import json, sqlite3, sys

          manifest = json.load(
              open("app/assets/db/content_manifest.json", encoding="utf-8")
          )["content_version"]
          shipped = sqlite3.connect("app/assets/db/content.db").execute(
              "SELECT value FROM meta WHERE key = 'content_version'"
          ).fetchone()[0]

          if manifest != shipped:
              sys.exit(
                  f"content_manifest.json says {manifest!r} but content.db "
                  f"says {shipped!r} — re-run `make content`"
              )
          print(f"content_version {shipped} matches in both shipped files")
          PY
          else
            echo "No $db committed yet — the workbooks are not in this"
            echo "repository. tools/tests/test_make_content.py verifies a"
            echo "database built from the fixtures, which ran above."
          fi

  goldens:
    name: goldens
    runs-on: windows-latest
    timeout-minutes: 25

    # Golden files are pixel comparisons and text rendering differs between
    # operating systems, so `app/test/golden/README.md` says they run on one
    # fixed platform. These were generated on Windows, so that is the runner —
    # anywhere else the diff would be about the renderer, not the design.
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned SDK
        id: sdk
        shell: bash
        run: |
          version="$(jq -er '.flutter' .fvmrc)"
          echo "Pinned Flutter: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r tools/requirements.txt

      # The Makefile's own commands rather than `make`: the Windows runner has
      # no make, and installing one to run two lines it already spells out
      # would be a dependency for nothing.
      - name: generate
        shell: bash
        run: |
          python tools/mirror_content_schema.py
          cd app
          flutter pub get
          dart run drift_dev schema steps drift_schemas/ lib/data/db/schema_versions.dart
          dart run drift_dev schema generate drift_schemas/ test/db/generated/
          dart run build_runner build --delete-conflicting-outputs

      - name: goldens-verify
        shell: bash
        working-directory: app
        run: flutter test test/golden
