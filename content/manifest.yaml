# What the content pipeline compiles into content.db.
#
# Order matters: it is the fallback level order for grammar rows that do not
# name a level of their own (content-pipeline.md).
#
# Paths are relative to the repository root; the workbooks live in data/. Adding a workbook is four
# steps — see "Adding a workbook" in docs/02-data/content-pipeline.md.

workbooks:
  - file: data/German_A1_Tracker.xlsx
  - file: data/German_A2_Tracker.xlsx
  - file: data/German_B1_Tracker.xlsx
  - file: data/German_B2_Tracker.xlsx
  - file: data/German_C1_Tracker.xlsx
  - file: data/German_C2_Tracker.xlsx
  # #1257 (the owner, 2026-10-03): words the course adds, written by
  # tools/additions_workbook.py from content/additions/*.yaml; the trackers
  # are never written by a tool.
  - file: data/German_Everyday_Additions.xlsx
    without: [collocations, synonyms_register]

tips: content/interference_tips.csv

# The course's category names in the meaning languages (#1128). A language's
# names ship when every category has one; English's are the workbooks' own.
category_names: content/category_names.csv

# Reviewed fixes to the workbooks, applied before anything else reads them.
# The workbooks themselves are never edited by a tool (#545, #628).
corrections: content/corrections.yaml
