    rule: "Second full mock; analyse errors by type; revise the grammar topics you still get wrong; decide whether to sit Goethe C1 or telc C1 Hochschule."
  "4b85c70fa865687b":
    why: "#637: the author's tracker (its weeks, its 'In progress' marks, their exam centre), which the app does not have"
    watch_out: "The attitude task tests exactly your work on connotation and irony."
  "8d3035e4ad730fd3":
    why: "#1137: the 'wrong' half was a verb-form error (ich hat), not the word order the line teaches"
    watch_out: "In a subordinate clause the auxiliary moves before the double infinitive: …, weil ich arbeiten müssen habe → …, weil ich habe arbeiten müssen."
  "ee702da8fbd7c4e6":
    why: "#1137: des Herrn has no -s"
    watch_out: "des Namens, des Herzens take -ns (n-declension plus -s); des Herrn takes only -n."
  "49509e11f09a615d":
    why: "#1137: 'muss … gelöst werden' (must) was equated with 'lässt sich … lösen' (can)"
    example_de: "Das Problem kann sofort gelöst werden. = Das Problem lässt sich sofort lösen. = Das Problem ist sofort zu lösen."
    example_en: "The problem can be solved immediately."
  "86530b65c341e05d":
    why: "#1137: the Goethe C1 talk is about 4 minutes, as the course's 'Sprechen C1' topic says"
    rule: "Free speaking without a script: These im ersten Satz, Gliederung ankündigen, Überleitungen (Damit komme ich zu …), Beispiele, Fazit, das die These aufgreift. Time: about 4 minutes in Goethe C1, followed by questions."
  "4e03ce67e311e280":
    why: "#1137: only the modal particles are unstressed and never first; freilich, allerdings, durchaus and zwar are adverbs, and the topic's own example opens with Freilich"
    rule: "ja (shared knowledge), doch (contradiction/reminder), eben/halt (resignation), wohl (assumption), schon (concessive), freilich/allerdings (qualification), durchaus (emphatic yes), zwar (concession). They carry attitude, not content. The modal particles proper (ja, doch, eben, halt, wohl, schon) are unstressed and never in position 1; freilich, allerdings, durchaus and zwar are adverbs and can open a sentence (Freilich gibt es …)."
  "57a3983414ab2c6f":
    why: "#1137: zu + Partizip I is necessity or possibility, as the topic's own rule says"
    watch_out: "Partizip I = active/ongoing, Partizip II = passive/completed, zu + Partizip I = necessity or possibility (die zu erwartenden Folgen)."
  "8001e28c085bafd2":
    why: "#1137: set phrases are the exception, and the topic's own example opens with one"
    watch_out: "The implicit subject must match the main clause subject, or the sentence is wrong. Set phrases are the exception: ausgehend von, abgesehen von, genau genommen."
