    why: "#1137: the Austrian summer semester starts in March; the winter semester's lectures end in January"
    example_de_1: "Im Jänner enden die Lehrveranstaltungen des Wintersemesters."
    example_en_1: "The winter semester's lectures end in January."
  "941216cf143e3779":
    why: "#1137: entbehren takes the accusative; 'auf … entbehren' mixes it with verzichten auf"
    example_de_2: "Das Auto können wir nicht entbehren."
grammar:
  "97ae2951ee9b24bc":
