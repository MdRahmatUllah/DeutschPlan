# Reviewed corrections to the authoring workbooks.
#
# The workbooks in data/ are the owner's, and no tool writes them: openpyxl
# drops their charts (#545). A fix to a row goes here instead, and the
# pipeline applies it after reading the workbooks and before it computes a
# uid or writes anything (docs/02-data/content-pipeline.md, "Corrections").
#
# Each key is the uid of the row as the workbook has it, in quotes. An entry
# says `why`, and sets any column the pipeline reads (`german`, `article`,
# `forms`, `english`, ...), one example line (`example_de_2` is the second
# German sentence, `example_en_2` its translation), `kind` (vocab, note or
# compare: PIPE-10's heuristic, overridden), or `delete: true`. A key that
# matches no row, or more than one, fails the build.
#
# This repository is public: an entry holds the new text only, never the text
# it replaces.

