yle="flex:1 1 0;display:flex;flex-direction:column;gap:1px"><span style="font-size:17px;font-weight:600">Konnten</span><div style="font-size:12px;line-height:16px;color:#5B5670;">Präteritum</div></span></button></div><div style="display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:#F3EADB;border-radius:12px"><div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#C8341F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C8341F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex-shrink:0"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> Not quite — the polite form is <i>Könnten</i></div><div style="font-size:14px;line-height:20px">Rule: <b>könnte</b> / <b>würde</b> + infinitive at the end of the sentence. <a href="GrammarTopic-ios.html" style="font-weight:600">See rule</a></div></div></div><div style="padding:16px 16px 32px"><button type="button" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:12px;background:#00C2B2;color:#15121F;font-size:17px;font-weight:600;border:2px solid #15121F;box-shadow:3px 3px 0 #15121F;width:100%;padding:0 16px;">Next</button></div>
