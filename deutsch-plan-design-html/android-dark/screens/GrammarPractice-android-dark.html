lex;flex-direction:column;gap:6px;padding:12px 14px;background:#29253A;border-radius:12px"><div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#FF8A7D"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8A7D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex-shrink:0"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> Not quite — the polite form is <i>Könnten</i></div><div style="font-size:14px;line-height:20px">Rule: <b>könnte</b> / <b>würde</b> + infinitive at the end of the sentence. <a href="GrammarTopic-android-dark.html" style="font-weight:600">See rule</a></div></div></div><div style="padding:16px 16px 32px"><button type="button" style="display:flex;align-items:center;justify-content:center;height:56px;border-radius:12px;background:#2EE6D6;color:#15121F;font-size:17px;font-weight:600;border:2px solid #F4F1FF;box-shadow:3px 3px 0 rgba(255,255,255,0.3);width:100%;padding:0 16px;">Next</button></div>
